<script>
function erf(x) {
    const sign = (x >= 0) ? 1 : -1;
    x = Math.abs(x);

    const a1 =  0.254829592;
    const a2 = -0.284496736;
    const a3 =  1.421413741;
    const a4 = -1.453152027;
    const a5 =  1.061405429;
    const p  =  0.3275911;

    const t = 1.0/(1.0 + p*x);
    const y = 1.0 - (((((a5*t + a4)*t) + a3)*t + a2)*t + a1)*t*Math.exp(-x*x);
    return sign*y;
}

function standardNormalQuantile(p) {
    function erfInv(x) {
        const a = 0.147;
        const y = Math.log(1 - x*x);
        const z = 2/(Math.PI * a) + y/2;
        return Math.sign(x) * Math.sqrt(Math.sqrt(z*z - y/a) - z);
    }
    
    if (p <= 0) return -Infinity;
    if (p >= 1) return Infinity;
    
    return Math.sqrt(2) * erfInv(2*p - 1);
}

function calculateCorrelation(x, y) {
    const n = x.length;
    if (n !== y.length || n === 0) return 0;

    const xMean = x.reduce((a, b) => a + b) / n;
    const yMean = y.reduce((a, b) => a + b) / n;

    let xxVar = 0;
    let yyVar = 0;
    let xyVar = 0;

    for (let i = 0; i < n; i++) {
        const xDiff = x[i] - xMean;
        const yDiff = y[i] - yMean;
        xxVar += xDiff * xDiff;
        yyVar += yDiff * yDiff;
        xyVar += xDiff * yDiff;
    }

    const correlation = xyVar / Math.sqrt(xxVar * yyVar);
    
    return isNaN(correlation) ? 0 : correlation;
}

function getRandomColors(count) {
    const colors = [];
    for (let i = 0; i < count; i++) {
        const hue = (i * 137.508) % 360;
        const saturation = 65 + Math.random() * 10;
        const lightness = 45 + Math.random() * 10;
        colors.push(`hsl(${hue}, ${saturation}%, ${lightness}%)`);
    }
    return colors;
}

let currentData = null;
let currentChart = null;
let currentChartType = null;
let currentXVar = null;
let currentYVar = null;

document.getElementById('fileUpload').addEventListener('change', function(e) {
    const file = e.target.files[0];
    const reader = new FileReader();
    
    document.querySelector('.loading').style.display = 'block';

    reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, {type: 'array'});
        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
        const jsonData = XLSX.utils.sheet_to_json(firstSheet);
        
        currentData = jsonData;
        populateVariableSelectors(jsonData);
        document.querySelector('.loading').style.display = 'none';
    };

    reader.readAsArrayBuffer(file);
});

function populateVariableSelectors(data) {
    if (!data || data.length === 0) return;
    
    const columns = Object.keys(data[0]);
    const xSelect = document.getElementById('xVariable');
    const ySelect = document.getElementById('yVariable');
    
    xSelect.innerHTML = '<option value="">اختر المتغير الأول (X)</option>';
    ySelect.innerHTML = '<option value="">اختر المتغير الثاني (Y)</option>';
    
    columns.forEach(column => {
        xSelect.add(new Option(column, column));
        ySelect.add(new Option(column, column));
    });
}

function createFacetGrid(data) {
    if (!currentData || !data.labels || !data.datasets) return;

    // Get all numeric columns for faceting
    const numericColumns = Object.keys(currentData[0]).filter(key => 
        !isNaN(parseFloat(currentData[0][key]))
    ).slice(0, 4); // Limit to 4 variables for readability

    // Create a 2x2 grid of scatter plots
    const plotData = [];
    const annotations = [];
    
    for (let i = 0; i < numericColumns.length - 1; i++) {
        for (let j = i + 1; j < numericColumns.length; j++) {
            const xVar = numericColumns[i];
            const yVar = numericColumns[j];
            
            // Calculate subplot position
            const row = Math.floor(i / 2);
            const col = i % 2;
            
            // Create scatter plot
            plotData.push({
                type: 'scatter',
                mode: 'markers',
                x: currentData.map(d => parseFloat(d[xVar])),
                y: currentData.map(d => parseFloat(d[yVar])),
                xaxis: `x${plotData.length + 1}`,
                yaxis: `y${plotData.length + 1}`,
                name: `${xVar} vs ${yVar}`,
                marker: {
                    size: 8,
                    color: `rgba(54, 162, 235, 0.6)`,
                    line: {
                        color: 'white',
                        width: 1
                    }
                }
            });
            
            // Add correlation coefficient annotation
            const correlation = calculateCorrelation(
                currentData.map(d => parseFloat(d[xVar])),
                currentData.map(d => parseFloat(d[yVar]))
            );
            
            annotations.push({
                xref: `x${plotData.length}`,
                yref: `y${plotData.length}`,
                x: 0.5,
                y: 0.9,
                text: `معامل الارتباط: ${correlation.toFixed(2)}`,
                showarrow: false,
                font: {
                    size: 12
                }
            });
        }
    }

    // Create layout with subplots
    const layout = {
        title: 'الرسوم متعددة العلاقات',
        grid: {
            rows: 2,
            columns: 2,
            pattern: 'independent'
        },
        annotations: annotations,
        showlegend: false,
        dir: 'rtl',
        height: 800,
        margin: {
            l: 60,
            r: 60,
            t: 80,
            b: 60
        }
    };

    // Add axis titles
    numericColumns.forEach((col, i) => {
        layout[`xaxis${i + 1}`] = { title: col };
        layout[`yaxis${i + 1}`] = { title: col };
    });

    const config = {
        responsive: true,
        displayModeBar: true,
        displaylogo: false,
    };

    // Clear existing plot and create new one
    const plotlyChart = document.getElementById('plotlyChart');
    if (plotlyChart) {
        Plotly.purge(plotlyChart);
        Plotly.newPlot('plotlyChart', plotData, layout, config);

        // Add interactivity
        plotlyChart.on('plotly_hover', function(data) {
            if (!data || !data.points || !data.points[0]) return;
            
            const point = data.points[0];
            const curveNumber = point.curveNumber;
            
            const update = {
                'marker.size': plotData.map((_, i) => 
                    i === curveNumber ? 12 : 8
                ),
                'marker.color': plotData.map((_, i) => 
                    i === curveNumber ? 'rgba(255, 99, 132, 0.6)' : 'rgba(54, 162, 235, 0.6)'
                )
            };
            
            Plotly.restyle('plotlyChart', update);
        });

        plotlyChart.on('plotly_unhover', function() {
            const update = {
                'marker.size': plotData.map(() => 8),
                'marker.color': plotData.map(() => 'rgba(54, 162, 235, 0.6)')
            };
            
            Plotly.restyle('plotlyChart', update);
        });
    }
}

// Add the case in the generateChart function:
function generateChart(chartType, xVar, yVar) {
    currentChartType = chartType;
    currentXVar = xVar;
    currentYVar = yVar;

    const chartData = {
        labels: currentData.map(row => row[xVar]),
        datasets: [{
            label: yVar,
            data: currentData.map(row => row[yVar]),
            backgroundColor: getRandomColors(currentData.length),
            borderColor: 'rgb(54, 162, 235)',
            borderWidth: 1
        }]
    };

    switch(chartType) {
        case 'bar':
        case 'line':
        case 'pie':
        case 'doughnut':
        case 'radar':
        case 'polarArea':
            createBasicChart(chartType, chartData);
            break;

        case 'histogram':
            createHistogram(chartData);
            break;

        case 'boxplot':
            createBoxPlot(chartData);
            break;

        case 'violin':
            createViolinPlot(chartData);
            break;

        case 'density':
            createDensityPlot(chartData);
            break;

        case 'density3d':
            create3DDensityPlot(chartData);
            break;

        case 'scatter':
            createScatterPlot(chartData);
            break;

        case 'bubble':
            createBubblePlot(chartData);
            break;

        case 'heatmap':
            createHeatmap(chartData);
            break;

        case 'correlationMatrix':
            createCorrelationMatrix(currentData);
            break;

        case 'waterfall':
            createWaterfallChart(chartData);
            break;

        case 'funnel':
            createFunnelChart(chartData);
            break;

        case 'treemap':
            createTreemap(chartData);
            break;

        case 'network':
            createNetworkGraph(chartData);
            break;

        case 'ppplot':
            createPPPlot(currentData, xVar);
            break;

        case 'qqplot':
            createQQPlot(currentData, xVar);
            break;

        case 'polarDistribution':
            createPolarDistributionPlot(chartData);
            break;

        case 'timeAreaChart':
            createTimeAreaChart(chartData);
            break;

        case 'timeSeries':
            createTimeSeries(chartData);
            break;

        case 'candlestick':
            createCandlestick(chartData);
            break;

        case 'sankey':
            createSankeyDiagram(chartData);
            break;

        case 'streamgraph':

            break;

        case 'facetGrid':

            break;

        case 'controlChart':
            createControlChart(chartData);
            break;
    }

    if (['scatter', 'bubble', 'line'].includes(chartType)) {
        makeDraggable(chartType);
    }
}

function createControlChart(data) {
    if (!data || !data.labels || !data.datasets || !data.datasets[0] || !data.datasets[0].data) {
        console.error('Invalid data format for Control Chart');
        return;
    }

    const values = data.datasets[0].data;
    const timePoints = data.labels;
    
    // Calculate control limits
    const mean = values.reduce((a, b) => a + b, 0) / values.length;
    const standardDev = Math.sqrt(values.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / values.length);
    
    const upperControlLimit = mean + 3 * standardDev;
    const lowerControlLimit = mean - 3 * standardDev;
    
    // Create plot data
    const plotData = [
        // Main data line
        {
            x: timePoints,
            y: values,
            type: 'scatter',
            mode: 'lines+markers',
            name: 'القياسات',
            line: {
                color: 'rgb(54, 162, 235)',
                width: 2
            },
            marker: {
                size: 6,
                color: values.map(v => 
                    v > upperControlLimit || v < lowerControlLimit 
                    ? 'rgb(255, 99, 132)' 
                    : 'rgb(54, 162, 235)'
                )
            }
        },
        // Center line (mean)
        {
            x: timePoints,
            y: Array(timePoints.length).fill(mean),
            type: 'scatter',
            mode: 'lines',
            name: 'المتوسط',
            line: {
                color: 'rgb(75, 192, 192)',
                width: 1,
                dash: 'dash'
            }
        },
        // Upper control limit
        {
            x: timePoints,
            y: Array(timePoints.length).fill(upperControlLimit),
            type: 'scatter',
            mode: 'lines',
            name: 'الحد الأعلى للتحكم',
            line: {
                color: 'rgb(255, 99, 132)',
                width: 1,
                dash: 'dot'
            }
        },
        // Lower control limit
        {
            x: timePoints,
            y: Array(timePoints.length).fill(lowerControlLimit),
            type: 'scatter',
            mode: 'lines',
            name: 'الحد الأدنى للتحكم',
            line: {
                color: 'rgb(255, 99, 132)',
                width: 1,
                dash: 'dot'
            }
        }
    ];

    const layout = {
        title: 'مخطط التحكم',
        xaxis: {
            title: 'الزمن',
            showgrid: true,
            gridcolor: 'rgba(0,0,0,0.1)'
        },
        yaxis: {
            title: 'القيمة',
            showgrid: true,
            gridcolor: 'rgba(0,0,0,0.1)'
        },
        showlegend: false,
        hovermode: 'closest',
        dir: 'rtl',
        plot_bgcolor: 'white',
        paper_bgcolor: 'white',
        margin: {
            l: 50,
            r: 50,
            t: 50,
            b: 50
        },
        annotations: [
            {
                x: timePoints[0],
                y: upperControlLimit,
                xref: 'x',
                yref: 'y',
                text: 'UCL',
                showarrow: false,
                font: {
                    size: 12
                },
                xanchor: 'right',
                yanchor: 'bottom'
            },
            {
                x: timePoints[0],
                y: lowerControlLimit,
                xref: 'x',
                yref: 'y',
                text: 'LCL',
                showarrow: false,
                font: {
                    size: 12
                },
                xanchor: 'right',
                yanchor: 'top'
            }
        ]
    };

    const config = {
        responsive: true,
        displayModeBar: true,
        displaylogo: false,
        modeBarButtonsToAdd: [{
            name: 'تحديث الحدود',
            icon: Plotly.Icons.pencil,
            click: function(gd) {
                // Randomly adjust control limits for demonstration
                const variation = standardDev * (Math.random() * 0.5);
                const newUCL = upperControlLimit + variation;
                const newLCL = lowerControlLimit - variation;
                
                Plotly.update('plotlyChart', {
                    'y': [null, null, 
                        Array(timePoints.length).fill(newUCL),
                        Array(timePoints.length).fill(newLCL)
                    ]
                }, {}, [0, 1, 2, 3]);
            }
        }]
    };

    // Clear existing plot and create new one
    const plotlyChart = document.getElementById('plotlyChart');
    if (plotlyChart) {
        Plotly.purge(plotlyChart);
        Plotly.newPlot('plotlyChart', plotData, layout, config);

        // Add hover effects
        plotlyChart.on('plotly_hover', function(data) {
            if (!data || !data.points || !data.points[0]) return;
            
            const point = data.points[0];
            const value = values[point.pointNumber];
            const colors = values.map((v, i) => 
                i === point.pointNumber
                    ? 'rgb(255, 99, 132)'
                    : v > upperControlLimit || v < lowerControlLimit 
                        ? 'rgb(255, 99, 132)' 
                        : 'rgb(54, 162, 235)'
            );
            
            Plotly.update('plotlyChart', {
                'marker.size': [Array(values.length).fill(6).fill(10, point.pointNumber, point.pointNumber + 1)],
                'marker.color': [colors]
            }, {}, [0]);
        });

        plotlyChart.on('plotly_unhover', function() {
            const colors = values.map(v => 
                v > upperControlLimit || v < lowerControlLimit 
                    ? 'rgb(255, 99, 132)' 
                    : 'rgb(54, 162, 235)'
            );

function createTimeSeries(data) {
    // Parse dates and values
    const timeData = data.labels.map((label, i) => ({
        time: new Date(label),
        value: data.datasets[0].data[i]
    })).sort((a, b) => a.time - b.time);

    // Calculate moving average
    const windowSize = 3;
    const movingAverage = timeData.map((point, i) => {
        const start = Math.max(0, i - windowSize + 1);
        const window = timeData.slice(start, i + 1);
        const avg = window.reduce((sum, p) => sum + p.value, 0) / window.length;
        return {
            time: point.time,
            value: avg
        };
    });

    const plotData = [
        {
            x: timeData.map(d => d.time),
            y: timeData.map(d => d.value),
            type: 'scatter',
            mode: 'lines+markers',

            y: movingAverage.map(d => d.value),
            type: 'scatter',
            mode: 'lines',
            name: 'المتوسط المتحرك',
            line: {
                color: 'rgb(255, 99, 132)',

                };
                Plotly.restyle('plotlyChart', update);

    Plotly.newPlot('plotlyChart', plotData, layout, config);

    // Add interactive features

function createDensityPlot(data) {
    const values = data.datasets[0].data;
    
    const min = Math.min(...values);
    const max = Math.max(...values);
    const points = Array.from({length: 100}, (_, i) => min + (max - min) * i / 99);
    
    const bandwidth = 0.15 * (max - min);
    const density = points.map(point => {
        return [
            point,
            values.reduce((sum, x) => {
                const z = (point - x) / bandwidth;
                return sum + Math.exp(-0.5 * z * z) / (bandwidth * Math.sqrt(2 * Math.PI));
            }, 0) / values.length
        ];
    });
    
    const plotData = [{
        x: density.map(d => d[0]),
        y: density.map(d => d[1]),
        type: 'scatter',
        mode: 'lines',
        fill: 'tozeroy',
        name: 'Density'
    }];
    
    const layout = {
        title: 'مخطط الكثافة',
        xaxis: { title: data.datasets[0].label },
        yaxis: { title: 'الكثافة' },
        dir: 'rtl'
    };

        responsive: true,
        displayModeBar: true,
        displaylogo: false
    };

    Plotly.newPlot('plotlyChart', plotData, layout, config);
}

function create3DDensityPlot(data) {
    const values = data.datasets[0].data;
    const labels = data.labels;
    
    const gridSize = 50;
    const x = Array.from({length: gridSize}, (_, i) => i);
    const y = Array.from({length: gridSize}, (_, i) => i);
    const z = Array(gridSize).fill().map(() => Array(gridSize).fill(0));
    
    const xRange = [Math.min(...values), Math.max(...values)];
    const yRange = [Math.min(...labels.map(l => Number(l))), Math.max(...labels.map(l => Number(l)))];
    const bandwidth = {
        x: (xRange[1] - xRange[0]) * 0.15,
        y: (yRange[1] - yRange[0]) * 0.15
    };

    for(let i = 0; i < gridSize; i++) {
        for(let j = 0; j < gridSize; j++) {
            const xi = xRange[0] + (xRange[1] - xRange[0]) * (i / (gridSize - 1));
            const yi = yRange[0] + (yRange[1] - yRange[0]) * (j / (gridSize - 1));
            
            let density = 0;
            for(let k = 0; k < values.length; k++) {
                const xk = values[k];
                const yk = Number(labels[k]);
                const dx = (xi - xk) / bandwidth.x;
                const dy = (yi - yk) / bandwidth.y;
                density += Math.exp(-(dx * dx + dy * dy) / 2) / (2 * Math.PI * bandwidth.x * bandwidth.y);
            }
            z[i][j] = density / values.length;
        }
    }

    const plotData = [{
        type: 'surface',
        x: x,
        y: y,
        z: z,
        colorscale: 'Viridis',
        contours: {
            z: {
                show: true,
                usecolormap: true,
                highlightcolor: "#42f462",
                project: {z: true}
            }
        }
    }];

    const layout = {
        title: 'مخطط الكثافة ثلاثي الأبعاد',
        scene: {
            xaxis: {title: 'المتغير X'},
            yaxis: {title: 'المتغير Y'},
            zaxis: {title: 'الكثافة'},
            camera: {
                eye: {x: 1.5, y: 1.5, z: 1.5}
            }
        },
        width: 800,
        height: 800,
        margin: {
            l: 65,
            r: 50,
            b: 65,
            t: 90,
        }
    };

    const config = {
        responsive: true,
        displayModeBar: true,
        displaylogo: false
    };

    Plotly.newPlot('plotlyChart', plotData, layout, config);
}

function createPPPlot(data, variable) {
    const values = data.map(row => parseFloat(row[variable])).filter(v => !isNaN(v));
    values.sort((a, b) => a - b);
    
    const n = values.length;
    const empirical = values.map((_, i) => (i + 1) / n);
    
    const mean = values.reduce((a, b) => a + b) / n;
    const std = Math.sqrt(values.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / n);
    
    const theoretical = values.map(x => {
        const z = (x - mean) / std;
        return 0.5 * (1 + erf(z / Math.sqrt(2)));
    });
    
    const plotData = [{
        x: theoretical,
        y: empirical,
        mode: 'markers',
        type: 'scatter',
        name: 'P-P Plot',
        marker: {
            size: 8,
            color: 'rgb(54, 162, 235)'
        }
    }, {
        x: [0, 1],
        y: [0, 1],
        mode: 'lines',
        type: 'scatter',
        name: 'Reference Line',
        line: {
            dash: 'dash',
            color: 'rgb(255, 99, 132)'

    }];
    
    const layout = {
        title: 'مخطط P-P للتوزيع الطبيعي',

}

function createQQPlot(data, variable) {
    const values = data.map(row => parseFloat(row[variable])).filter(v => !isNaN(v));
    values.sort((a, b) => a - b);
    
    const n = values.length;
    const theoreticalQuantiles = values.map((_, i) => {
        const p = (i + 0.5) / n;
        return standardNormalQuantile(p);
    });
    
    const mean = values.reduce((a, b) => a + b) / n;
    const std = Math.sqrt(values.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / n);
    const standardizedValues = values.map(x => (x - mean) / std);
    
    const plotData = [{

function createPredictionChart(data) {
    const timeData = data.labels.map((label, i) => ({
        time: new Date(label),
        value: data.datasets[0].data[i]
    })).sort((a, b) => a.time - b.time);

    const xValues = timeData.map(d => d.time.getTime());
    const yValues = timeData.map(d => d.value);
    
    const n = xValues.length;
    const xMean = xValues.reduce((a, b) => a + b) / n;
    const yMean = yValues.reduce((a, b) => a + b) / n;
    
    let slope = 0;
    let intercept = 0;
    let numerator = 0;
    let denominator = 0;
    
    for (let i = 0; i < n; i++) {
        numerator += (xValues[i] - xMean) * (yValues[i] - yMean);
        denominator += Math.pow(xValues[i] - xMean, 2);
    }
    
    slope = numerator / denominator;
    intercept = yMean - slope * xMean;

    const lastDate = new Date(Math.max(...xValues));
    const predictionPoints = [];
    for (let i = 0; i < 10; i++) {
        const futureDate = new Date(lastDate);
        futureDate.setDate(futureDate.getDate() + i * 30);
        const predictedValue = slope * futureDate.getTime() + intercept;
        predictionPoints.push({
            time: futureDate,
            value: predictedValue
        });
    }

    const predictionInterval = calculatePredictionInterval(xValues, yValues, slope, intercept);
    const upperBound = predictionPoints.map(point => ({
        time: point.time,
        value: point.value + predictionInterval
    }));
    const lowerBound = predictionPoints.map(point => ({
        time: point.time,
        value: point.value - predictionInterval
    }));

    const plotData = [
        {
            x: timeData.map(d => d.time),
            y: timeData.map(d => d.value),
            type: 'scatter',
            mode: 'lines+markers',
            name: 'البيانات التاريخية',
            line: {
                color: 'rgb(54, 162, 235)',
                width: 2
            },
            marker: {
                size: 6
            }
        },
        {
            x: predictionPoints.map(d => d.time),
            y: predictionPoints.map(d => d.value),
            type: 'scatter',
            mode: 'lines',
            name: 'التنبؤ',
            line: {
                color: 'rgb(255, 99, 132)',
                width: 2,
                dash: 'dash'
            }
        },
        {
            x: [...upperBound.map(d => d.time), ...lowerBound.map(d => d.time).reverse()],
            y: [...upperBound.map(d => d.value), ...lowerBound.map(d => d.value).reverse()],
            fill: 'toself',
            fillcolor: 'rgba(255, 99, 132, 0.2)',
            line: {width: 0},
            name: 'فترة الثقة',
            showlegend: true,
            type: 'scatter'
        }
    ];

    const layout = {
        title: 'التنبؤ المرئي للبيانات',
        xaxis: {
            title: 'الزمن',
            type: 'date'
        },
        yaxis: {
            title: 'القيمة'
        },
        showlegend: true,
        dir: 'rtl',
        hovermode: 'closest',
        annotations: [{
            x: predictionPoints[predictionPoints.length - 1].time,
            y: predictionPoints[predictionPoints.length - 1].value,
            text: 'نهاية التنبؤ',
            showarrow: true,
            arrowhead: 2,
            arrowsize: 1,
            arrowwidth: 2,
            ax: -30,
            ay: -30
        }]
    };

    const config = {
        responsive: true,
        displayModeBar: true,
        displaylogo: false
    };

    Plotly.newPlot('plotlyChart', plotData, layout, config);
}

function calculatePredictionInterval(xValues, yValues, slope, intercept) {
    const n = xValues.length;
    const yPred = xValues.map(x => slope * x + intercept);
    
    const residuals = yValues.map((y, i) => y - yPred[i]);
    const sumSquaredResiduals = residuals.reduce((sum, r) => sum + r * r, 0);
    const standardError = Math.sqrt(sumSquaredResiduals / (n - 2));
    
    return standardError * 1.96;
}

function createParallelCoordinates(data) {
    const columns = Object.keys(data[0]).filter(key => 
        !isNaN(parseFloat(data[0][key]))
    );
    
    const dimensions = columns.map(col => {
        const values = data.map(d => parseFloat(d[col]));
        const min = Math.min(...values);
        const max = Math.max(...values);
        
        return {
            range: [min, max],
            label: col,
            values: values.map(v => 
                max === min ? 0.5 : (v - min) / (max - min)
            )
        };
    });

    const traces = [{
        type: 'parcoords',
        line: {
            color: dimensions[0].values,
            colorscale: 'Blues'
        },
        dimensions: dimensions.map(dim => ({
            range: [0, 1],
            label: dim.label,
            values: dim.values
        }))
    }];

    const layout = {
        title: 'الرسم متعدد الأبعاد',
        plot_bgcolor: '#fff',
        paper_bgcolor: '#fff',
        dir: 'rtl',
        height: 600,
        margin: {
            l: 80,
            r: 80,
            t: 100,
            b: 50
        }
    };

    const config = {
        responsive: true,
        displayModeBar: true,
        modeBarButtonsToRemove: ['lasso2d', 'select2d'],
        displaylogo: false
    };

    Plotly.newPlot('plotlyChart', traces, layout, config);
    const myPlot = document.getElementById('plotlyChart');

        if (!eventData || !eventData.points || !eventData.points[0]) return;
        
        try {
            const pointNumber = eventData.points[0].pointNumber;
            const colors = Array(dimensions[0].values.length).fill('rgba(54, 162, 235, 0.1)');
            colors[pointNumber] = 'rgb(255, 99, 132)';
            
            Plotly.restyle('plotlyChart', {
                'line.color': [colors]
            });
        } catch (error) {
            console.log('Hover event error:', error);
        }
    });

    myPlot.on('plotly_unhover', function() {
        try {
            Plotly.restyle('plotlyChart', {
                'line.color': [dimensions[0].values]
            });
        } catch (error) {
            console.log('Unhover event error:', error);
        }
    });
}

// Create Seasonal Chart Function
function createSeasonalChart(data) {
    const timeData = data.datasets[0].data;
    const labels = data.labels;

    const dates = labels.map(label => new Date(label));

    const seasonalData = {
        winter: [],
        spring: [],
        summer: [],
        autumn: []
    };

    dates.forEach((date, i) => {
        const month = date.getMonth();
        const value = timeData[i];

        if (month >= 11 || month <= 1) {
            seasonalData.winter.push(value);
        } else if (month >= 2 && month <= 4) {
            seasonalData.spring.push(value);
        } else if (month >= 5 && month <= 7) {
            seasonalData.summer.push(value);
        } else {
            seasonalData.autumn.push(value);
        }
    });

    const seasonalAverages = {};
    Object.keys(seasonalData).forEach(season => {
        const values = seasonalData[season];
        seasonalAverages[season] = values.length > 0 
            ? values.reduce((a, b) => a + b) / values.length 
            : 0;
    });

    const plotData = [{
        type: 'scatter',
        mode: 'lines+markers',
        x: Object.keys(seasonalAverages),
        y: Object.values(seasonalAverages),
        line: {
            color: 'rgb(54, 162, 235)',
            width: 2
        },
        marker: {
            size: 8,
            symbol: 'circle',

            line: {
                color: 'white',
                width: 1
            }
        },
        name: 'المتوسط الموسمي'
    }];

    Object.keys(seasonalData).forEach(season => {
        const values = seasonalData[season];
        if (values.length > 0) {
            plotData.push({
                type: 'scatter',
                mode: 'lines',
                x: [season, season],
                y: [Math.min(...values), Math.max(...values)],
                line: {
                    color: 'rgba(54, 162, 235, 0.2)',
                    width: 1
                },
                showlegend: false
            });

    const layout = {
        title: 'التحليل الموسمي',
        xaxis: {
            title: 'الفصول',
            ticktext: ['الشتاء', 'الربيع', 'الصيف', 'الخريف'],

            title: 'القيمة'
        },
        showlegend: true,
        dir: 'rtl',
        hovermode: 'closest',
        updatemenus: [{
            type: 'buttons',
            showactive: false,
            x: 0.1,
            y: 1.1,
            buttons: [{
                label: 'تشغيل الرسم المتحرك',
                method: 'animate',
                args: [null, {
                    mode: 'immediate',
                    frame: {
                        duration: 500,
                        redraw: true
                    },
                    transition: {
                        duration: 500,
                        easing: 'cubic-in-out'
                    }
                }]

        frames: [{

function makeDraggable(chartType) {
    const chart = document.getElementById('plotlyChart');
    let isDragging = false;
    let currentPoint = null;
    let originalData = null;

    function onPointDragStart(e) {
        isDragging = true;
        currentPoint = e.target;
        const dataIndex = currentPoint.getAttribute('data-index');
        originalData = {...currentData[dataIndex]};
    }

    function onPointDragMove(e) {
        if (!isDragging) return;
        
        const rect = chart.getBoundingClientRect();
        const xScale = d3.scaleLinear()
            .domain([rect.left, rect.right])
            .range([0, 1]);
        const yScale = d3.scaleLinear()
            .domain([rect.bottom, rect.top])
            .range([0, 1]);

        const x = xScale(e.clientX);
        const y = yScale(e.clientY);

        updateChartPoint(currentPoint, x, y);
    }

    function onPointDragEnd() {
        isDragging = false;
        currentPoint = null;
        originalData = null;
    }

    function updateChartPoint(point, x, y) {
        const dataIndex = point.getAttribute('data-index');
        const update = {
            x: [[x]],
            y: [[y]]
        };

        Plotly.restyle('plotlyChart', update, [dataIndex]);
    }

    const points = chart.getElementsByClassName('point');
    Array.from(points).forEach((point, index) => {
        point.setAttribute('data-index', index);
        point.addEventListener('mousedown', onPointDragStart);
    });

    document.addEventListener('mousemove', onPointDragMove);
    document.addEventListener('mouseup', onPointDragEnd);

    const controls = document.createElement('div');
    controls.className = 'chart-controls';
    controls.innerHTML = `
        <button class="btn" onclick="resetChart()">إعادة تعيين</button>
        <button class="btn" onclick="saveChartState()">حفظ التغييرات</button>
    `;
    chart.parentElement.appendChild(controls);
}

function createCandlestick(data) {
    // Validate and format the data
    if (!data || !data.labels || !data.datasets || !data.datasets[0] || !data.datasets[0].data) {
        console.error('Invalid data format for candlestick chart');
        return;
    }

    // Format data for candlestick chart
    // Assuming data contains OHLC (Open, High, Low, Close) values
    const timePoints = data.labels.map(label => new Date(label));
    const values = data.datasets[0].data;

    // Generate sample OHLC data if only single values provided
    const candlestickData = timePoints.map((time, i) => {
        const baseValue = values[i];
        // Generate realistic OHLC data around the base value
        const volatility = baseValue * 0.02; // 2% volatility
        return {
            date: time,
            open: baseValue - volatility/2,
            high: baseValue + volatility,
            low: baseValue - volatility,
            close: baseValue + volatility/2
        };
    });

    const plotData = [{
        type: 'candlestick',
        x: candlestickData.map(d => d.date),
        open: candlestickData.map(d => d.open),
        high: candlestickData.map(d => d.high),
        low: candlestickData.map(d => d.low),

        increasing: {
            line: { color: '#26a69a' },

                    'fillcolor': newColors,
                    'line.color': newColors.map(color => color.replace('0.6', '0.8'))
                };
                
                Plotly.restyle('plotlyChart', update);
            }
        }]
    };

    // Clear existing plot and create new one
    const plotlyChart = document.getElementById('plotlyChart');
    if (plotlyChart) {
        Plotly.purge(plotlyChart);
        Plotly.newPlot('plotlyChart', series, layout, config);

        // Add interactive features
        plotlyChart.on('plotly_hover', function(data) {
            if (!data || !data.points || !data.points[0]) return;
            
            const point = data.points[0];
            const traceIndex = point.curveNumber;
            
            const update = {
                'fillcolor': series.map((_, i) => 
                    i === traceIndex ? 'rgba(255, 99, 132, 0.6)' : series[i].fillcolor
                ),
                'line.color': series.map((_, i) => 
                    i === traceIndex ? 'rgba(255, 99, 132, 0.8)' : series[i].line.color
                )
            };
            
            Plotly.restyle('plotlyChart', update);
        });

        plotlyChart.on('plotly_unhover', function() {
            const update = {
                'fillcolor': series.map(s => s.fillcolor),
                'line.color': series.map(s => s.line.color)
            };
            
            Plotly.restyle('plotlyChart', update);
        });
    }
}
</script>
</body></html>
